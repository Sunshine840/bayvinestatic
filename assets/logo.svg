<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Definitions for gradients and reusable paths -->
  <defs>
    <style>
      .gold-ring { fill: none; stroke: #CCA453; stroke-width: 10; }
      .text-primary { fill: #1E5033; font-family: 'Cinzel', 'Times New Roman', serif; font-weight: 700; text-anchor: middle; }
      .text-secondary { fill: #1E5033; font-family: 'Montserrat', 'Arial', sans-serif; font-weight: 600; letter-spacing: 5px; text-anchor: middle; }
      .swirl { fill: none; stroke: #1E5033; stroke-width: 2.5; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Outer Gold Circle -->
  <circle cx="250" cy="250" r="215" class="gold-ring" />

  <!-- Top Vine Swirl -->
  <path d="M 160 165 C 200 160, 240 178, 335 167" class="swirl" />

  <!-- Detailed Leaf Illustration -->
  <g transform="translate(160, 105)">
    <!-- Base Leaf Outline & Base Shading -->
    <path d="M 45,95 C 10,85 -10,60 5,30 C 20,0 80,-10 145,5 C 130,40 120,70 95,85 C 75,97 55,98 45,95 Z" fill="#4B8B42" />
    
    <!-- Darker Green Shadows/Layers -->
    <path d="M 45,95 C 25,75 20,45 40,25 C 60,5 110,0 145,5 C 115,35 90,75 45,95 Z" fill="#2D6633" />
    <path d="M 50,60 C 35,45 40,30 60,20 C 85,10 125,5 145,5 C 120,25 90,50 50,60 Z" fill="#1E4D2B" />

    <!-- Light Highlights -->
    <path d="M 70,18 C 100,10 130,6 145,5 C 125,20 105,35 85,42 C 75,30 70,22 70,18 Z" fill="#6CB359" opacity="0.7" />

    <!-- Central Vein -->
    <path d="M 25,103 Q 75,60 145,5" fill="none" stroke="#88C458" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Side Veins -->
    <path d="M 55,75 Q 70,68 85,73 M 70,60 Q 90,50 110,57 M 88,43 Q 105,33 125,40 M 105,28 Q 120,20 135,24" fill="none" stroke="#88C458" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="250" y="235" class="text-primary" font-size="42" letter-spacing="1">BAY VINE</text>
  <text x="250" y="285" class="text-primary" font-size="42" letter-spacing="1">SOLUTION</text>

  <!-- Subtitle -->
  <text x="252" y="325" class="text-secondary" font-size="22">LIMITED</text>

  <!-- Bottom Decorative Swirl -->
  <path d="M 170,340 C 220,370 280,370 330,345" class="swirl" />
</svg>
